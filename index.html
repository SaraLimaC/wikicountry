<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wikicountry</title>
  </head>
  <body>
    
    <header>
      <h1>🌍 Wikicountry </h1>
      <p>Busca países o selecciónalos de la lista</p>
    </header>

    <main>

      <section id="busqueda">

        <div class="buscador">
          <input
            type="text"
            id="pais"
            placeholder="Buscar país en inglés..."
          >

          <button id="buscar"> Buscar </button>

          <p id="estadisticas"></p>
        </div>

        <p id="mensaje"></p>

        <div id="listaPaises"></div>

      </section>

      <section id="detalle" hidden>

        <button id="volver"> ← Volver </button>

        <div id="resultado"></div>

      </section>
        
      <aside id="contenido">
            
        <p>Selector de regiones</p>
            
        <select id="region">
                
          <option value="">Todas</option>
          
          <option value="Europe">Europa</option>
          
          <option value="Asia">Asia</option>
          
          <option value="Africa">África</option>
          
          <option value="Americas">América</option>
          
          <option value="Oceania">Oceanía</option>
          
          <option value="Polar">Polar</option>
          
          <option value="Antarctic">Antártida</option>
          
          <option value="Antarctic Ocean">Océano Antártico</option>
          
        </select>
        
      </aside>

    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
